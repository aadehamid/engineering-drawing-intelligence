name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # SQL Server for the vendor-style backend tests (DEC-027). The password is a
    # throwaway for this job's container, not a secret.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Liong-CI-2026!
        ports:
          - 1433:1433
      # Neo4j Community 2026.09.0 for the graph publish tests (DEC-056), pinned by digest
      # (DEC-067). The password is a throwaway for this job's container, not a secret.
      neo4j:
        image: neo4j@sha256:6f3f17e72d69bb6f26b03f6186f5afb15a201f8b460bb69b0cd8030717f9f01a
        env:
          NEO4J_AUTH: neo4j/liong-ci-2026
        ports:
          - 7687:7687
    env:
      LIONG_SQLSERVER: localhost,1433,sa,Liong-CI-2026!
      LIONG_NEO4J: bolt://localhost:7687,neo4j,liong-ci-2026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: scripts/check.sh
